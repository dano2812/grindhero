name: Implementation task
description: A small, acceptance-driven increment from the roadmap
title: "[Task] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Player/developer benefit and related milestone or decision.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Explicit in-scope and out-of-scope behavior.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and decisions
      description: Prerequisite issue IDs and unresolved decisions; use N/A if none.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable behavior, failure cases, and measurable limits.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and risks
      description: Automated tests, device evidence, save compatibility, security/performance risks.
    validations:
      required: true
